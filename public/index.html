<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Critters Pinball</title>
    <script src="https://telegram.org"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1a2e; color: #fff; font-family: sans-serif; overflow: hidden; }
        #game-container { width: 100%; height: 82vh; background: #1a1a2e; position: relative; }
        #ui-container { height: 18vh; display: flex; justify-content: space-around; align-items: center; background: #161623; box-sizing: border-box; padding: 10px; }
        .btn { background: #ff4757; border: none; padding: 15px 25px; color: white; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; z-index: 10; }
        .score { font-size: 14px; font-weight: bold; white-space: nowrap; }
    </style>
</head>
<body>

    <div id="game-container" id="canvas-parent"></div>
    <div id="ui-container">
        <div class="score">Баланс: <span id="ball-count">50</span> 🟡</div>
        <button class="btn" id="launch-btn">СТАРТ X10</button>
        <div class="score">Очки: <span id="score-count">0</span> 🏆</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Берём размеры контейнера, а если они нулевые — рассчитываем от экрана
        const container = document.getElementById('game-container');
        const width = container.clientWidth || window.innerWidth;
        const height = container.clientHeight || (window.innerHeight * 0.82);

        const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
        const engine = Engine.create({ gravity: { y: 1 } });
        const world = engine.world;

        const render = Render.create({
            element: container,
            engine: engine,
            options: { 
                width: width, 
                height: height, 
                wireframes: false, 
                background: '#1a1a2e' 
            }
        });
        Render.run(render);
        Runner.run(Runner.create(), engine);

        let ballsLeft = 50;
        let score = 0;

        // Ограничительные стены (делаем их чуть толще, чтобы шары не вылетали)
        const leftWall = Bodies.rectangle(5, height/2, 20, height, { isStatic: true, render: { fillStyle: '#2e2e40' } });
        const rightWall = Bodies.rectangle(width - 5, height/2, 20, height, { isStatic: true, render: { fillStyle: '#2e2e40' } });
        Composite.add(world, [leftWall, rightWall]);

        // Препятствия (гвоздики / Pegs)
        const rows = 6;
        const pegRadius = 5;
        for (let i = 0; i < rows; i++) {
            const pegsInRow = i % 2 === 0 ? 7 : 6;
            const spacing = width / (pegsInRow + 1);
            for (let j = 0; j < pegsInRow; j++) {
                const x = spacing * (j + 1);
                const y = 120 + (i * 55);
                const peg = Bodies.circle(x, y, pegRadius, { 
                    isStatic: true, 
                    label: 'peg',
                    render: { fillStyle: '#00d2d3' } 
                });
                Composite.add(world, peg);
            }
        }

        // Приемные слоты снизу
        const slotCount = 5;
        const slotWidth = width / slotCount;
        const rewards = [10, 50, 100, 50, 10]; // Очки за каждый слот];

        for (let i = 0; i < slotCount; i++) {
            if (i > 0) {
                const divider = Bodies.rectangle(i * slotWidth, height - 30, 6, 60, { isStatic: true, render: { fillStyle: '#5f27cd' } });
                Composite.add(world, divider);
            }
            const sensor = Bodies.rectangle(i * slotWidth + slotWidth/2, height - 10, slotWidth - 6, 20, {
                isStatic: true,
                isSensor: true,
                label: `slot_${rewards[i]}`,
                render: { fillStyle: 'transparent' }
            });
            Composite.add(world, sensor);
        }

        // Логика запуска шаров
        document.getElementById('launch-btn').addEventListener('click', () => {
            if (ballsLeft < 10) return;
            ballsLeft -= 10;
            document.getElementById('ball-count').innerText = ballsLeft;

            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const randomX = (width / 2) + (Math.random() * 60 - 30);
                    const ball = Bodies.circle(randomX, 30, 8, {
                        restitution: 0.5,
                        friction: 0.02,
                        label: 'ball',
                        render: { fillStyle: '#ff9f43' }
                    });
                    Composite.add(world, ball);
                }, i * 120);
            }
        });

        // Отслеживание попаданий
        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach((pair) => {
                const ballBody = pair.bodyA.label === 'ball' ? pair.bodyA : (pair.bodyB.label === 'ball' ? pair.bodyB : null);
                const slotLabel = pair.bodyA.label.startsWith('slot_') ? pair.bodyA.label : (pair.bodyB.label.startsWith('slot_') ? pair.bodyB.label : null);

                if (ballBody && slotLabel) {
                    const points = parseInt(slotLabel.split('_')[1]);
                    score += points;
                    document.getElementById('score-count').innerText = score;
                    Composite.remove(world, ballBody);
                }
            });
        });
    </script>
</body>
</html>
